name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_RELEASE: 4.7-stable
      GODOT_TEMPLATE_VERSION: 4.7.stable
      ANDROID_API: 36
      ANDROID_BUILD_TOOLS: 35.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "cmdline-tools;latest"
      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          unzip -q "Godot_v${GODOT_RELEASE}_export_templates.tpz" -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
          rm -rf android/build
          godot --headless --path . --install-android-build-template
          test -f android/build/build.gradle
          test -f android/build/.build_version
      - name: Configure and validate
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" builds/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          godot --headless --editor --path . --import --quit
          godot --headless --path . --quit-after 2
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --verbose --path . --export-debug "Android Debug" builds/android/Ricochet-Strike-debug.apk
          test -s builds/android/Ricochet-Strike-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ricochet-Strike-debug-apk
          path: builds/android/Ricochet-Strike-debug.apk
          if-no-files-found: error
