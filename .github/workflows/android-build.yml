name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [react-capacitor]
  pull_request:
    branches: [react-capacitor]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test -- --run

      - name: Build Web Production Bundle
        run: npm run build

      - name: Verify Web Output Directory
        run: test -f dist/index.html

      - name: Setup Android SDK Platform 36
        uses: android-actions/setup-android@v3

      - name: Setup Android Build Tools 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.1" "cmdline-tools;latest"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify Output APK Exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ricochet-Strike-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
